<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween House</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020202; overflow: hidden; }
    #stage { display: block; width: 1080px; height: 1920px; }
    .live #stage { width: 100vw; height: 100vh; object-fit: contain; }
    #sound {
      display: none; position: fixed; right: 16px; bottom: 16px;
      font: 500 13px/1 Georgia, serif; letter-spacing: 0.18em; text-transform: uppercase;
      color: #efe6d6; background: rgba(10, 6, 4, 0.7); border: 1px solid #c4521f;
      border-radius: 999px; padding: 12px 18px; cursor: pointer;
    }
    .live #sound { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "gsap": "./node_modules/gsap/index.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <button id="sound" type="button" aria-pressed="false">Tap for sound</button>
  <audio id="soundtrack" src="./assets/soundtrack.m4a" loop preload="auto"></audio>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
